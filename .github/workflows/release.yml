name: build

on:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build WhenFiled.slnx -c Release
      - run: dotnet test WhenFiled.slnx -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        run: dotnet publish src/WhenFiled.App -c Release -r win-x64 -o artifacts
      - name: Checksum
        shell: bash
        run: |
          cd artifacts
          sha256sum WhenFiled.App.exe > WhenFiled.App.exe.sha256
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/WhenFiled.App.exe artifacts/WhenFiled.App.exe.sha256 --title "$GITHUB_REF_NAME" --generate-notes
